<dialog id="chat-dialog" class="chat-dialog" aria-labelledby="chat-title">
  <div class="chat-panel">
    <header class="chat-header">
      <div class="chat-avatar" aria-hidden="true">F</div>
      <div>
        <span class="eyebrow">FITNESS COMPANION</span>
        <h2 id="chat-title">FitAI</h2>
      </div>
      <span class="chat-preview-tag">UI PREVIEW</span>
      <button
        id="chat-close"
        class="icon-button"
        type="button"
        aria-label="Close chat"
        title="Close chat"
      >
        ×
      </button>
    </header>
    <div class="chat-body">
      <div class="chat-date">TODAY</div>
      <div class="chat-welcome">
        <span class="chat-spark" aria-hidden="true">✳</span>
        <div>
          <strong>Your training companion</strong>
          <p>This chat panel is a visual preview.</p>
        </div>
      </div>
      <div class="chat-suggestions" aria-label="Suggested topics">
        <span>Workout planning</span><span>Nutrition basics</span
        ><span>Recovery</span>
      </div>
    </div>
    <form class="chat-composer" aria-label="Chat message preview">
      <input type="text" placeholder="Messaging is not connected" disabled />
      <button
        class="button button-dark"
        type="button"
        disabled
        aria-label="Send message"
        title="Chat preview only"
      >
        ↑
      </button>
    </form>
  </div>
</dialog>
